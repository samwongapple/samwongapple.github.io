- id: temporal-entanglement
  name: "Temporal entanglement"
  symbol: null
  blurb: "Entanglement of the influence matrix across a cut in time; the fingerprint of the bath's dynamical phase."
  tags: [temporal-methods, formalism]

# =============================================================================
# SOLVABLE CIRCUITS — canonical home: "Brickwork Circuits" (P1) and
# "Dual Unitarity: Exactly Solvable, Genuinely Chaotic" (P2).
#
# Notation notes for this thread (conventions pinned in P1's scaffold comment):
#   q    local Hilbert dimension (the free-fermion thread's L×L matrices use L;
#        no collision — q is reserved here).
#   Ũ    the RESHUFFLED gate, not the partial transpose.
#   M_±  light-ray channels; which trace goes with which ray is fixed by the
#        even-layer-first convention and stated in P2.
# =============================================================================

- id: brickwork-circuit
  name: "Brickwork circuit"
  symbol: "U \\in U(q^2)"
  blurb: "Staggered layers of one repeated two-site gate — locality plus unitarity and nothing else, the minimal model of many-body dynamics."
  tags: [solvable-circuits, model]

- id: operator-vectorization
  name: "Operator vectorization"
  symbol: "\\lvert O \\rangle\\rangle"
  blurb: "Operators as vectors in a doubled space with the Hilbert–Schmidt pairing; conjugation becomes the folded gate acting from the left."
  tags: [solvable-circuits, technique]

- id: lightcone-causality
  name: "Strict light-cone causality"
  symbol: "C(x,t) = 0 \\;\\; \\text{outside}"
  blurb: "Unitarity cancels every gate outside the causal diamond, so correlators vanish identically — not approximately — beyond one site per layer."
  tags: [solvable-circuits, result]

- id: dual-unitary-circuits
  name: "Dual-unitary circuits"
  symbol: "U, \\; \\tilde{U}"
  blurb: "Circuits whose gate is unitary read in time and in space — the temporal thread's maximally solvable extreme, and this thread's defining condition."
  tags: [solvable-circuits, model]

- id: gate-reshuffling
  name: "Gate reshuffling"
  symbol: "\\tilde{U}_{(db),(ca)} = U_{(ab),(cd)}"
  blurb: "Regrouping a gate's legs so space pairs become input/output — a leg transposition across the diagram, not the partial transpose."
  tags: [solvable-circuits, technique]

- id: du-correlation-collapse
  name: "Correlation collapse onto light rays"
  symbol: null
  blurb: "In a dual-unitary circuit every infinite-temperature two-point function vanishes exactly except on the light rays x = ±2t."
  tags: [solvable-circuits, result]

- id: lightray-channel
  name: "Light-ray channel"
  symbol: "\\mathcal{M}_{\\pm}"
  blurb: "The one-site unital quantum channel, built from the gate by a partial trace, whose powers generate the on-ray correlations forever."
  tags: [solvable-circuits, formalism]

- id: du-ergodicity-classification
  name: "Ergodicity classification by channel spectrum"
  symbol: "\\lvert\\lambda\\rvert \\lessgtr 1"
  blurb: "The eigenvalues of M± sort dual-unitary circuits into ergodic-and-mixing, non-mixing, and soliton-carrying nonergodic classes."
  tags: [solvable-circuits, result]

# =============================================================================
# CRITICAL DYNAMICS — canonical home: "When Adiabaticity Fails: Kibble–Zurek"
# =============================================================================

- id: instantaneous-eigenstates
  name: "Instantaneous eigenstates"
  symbol: "H(t)\\lvert n(t)\\rangle = E_n(t)\\lvert n(t)\\rangle"
  blurb: "The snapshot eigenbasis at each moment; no physical state is obliged to follow it."
  tags: [critical-dynamics, formalism]

- id: adiabatic-theorem
  name: "Adiabatic theorem"
  symbol: "\\hbar\\lvert\\langle m\\rvert\\partial_t H\\lvert n\\rangle\\rvert / (E_m - E_n)^2 \\ll 1"
  blurb: "A slowly driven state tracks its instantaneous eigenstate; adiabaticity dies by the gap, as 1/Δ²."
  tags: [critical-dynamics, result]

- id: response-time
  name: "Response time"
  symbol: "\\tau_{\\text{response}} \\sim \\hbar/\\Delta"
  blurb: "The time a gapped system needs to notice its Hamiltonian changed; diverges at a critical point."
  tags: [critical-dynamics, formalism]

# --- PLANNED: claimed by the Kibble–Zurek post, sections unwritten ---
- id: landau-zener
  name: "Landau–Zener formula"
  symbol: "P_{\\mathrm{ex}} = e^{-\\pi\\Delta^2/2\\hbar v}"
  blurb: "A single avoided crossing swept at constant rate — the minimal quench, solved exactly."
  tags: [critical-dynamics, result]

- id: quench-ramp
  name: "Quench ramp"
  symbol: "\\lambda(t) = t/\\tau_Q"
  blurb: "Linear drive of the control parameter through the critical point at rate 1/τ_Q."
  tags: [critical-dynamics, formalism]

- id: tfim
  name: "Transverse-field Ising chain"
  symbol: "g"
  blurb: "The exactly solvable testbed: a continuum of Landau–Zener crossings, one per momentum mode."
  tags: [critical-dynamics, model]

- id: kibble-zurek-freezeout
  name: "Kibble–Zurek freeze-out"
  symbol: "\\hat{t}"
  blurb: "The heuristic: the system stops keeping up when the response time equals the time left to the transition."
  tags: [critical-dynamics, result]

- id: kz-scaling-exponents
  name: "Kibble–Zurek scaling"
  symbol: "\\hat{\\xi} \\propto \\tau_Q^{\\nu/(1+z\\nu)}"
  blurb: "Frozen length and defect density as power laws in the ramp rate, built from equilibrium exponents alone."
  tags: [critical-dynamics, result]

- id: defect-density
  name: "Defect density"
  symbol: "n \\sim \\tau_Q^{-1/2}"
  blurb: "Kinks left behind by a finite-speed crossing; the headline prediction for the Ising chain."
  tags: [critical-dynamics, result]

# =============================================================================
# SUPERCONDUCTIVITY — canonical home: "What Needs Explaining" and its sequels
#
# Notation notes for this thread (see CONTRIBUTING-posts.md §4):
#   λ_L  penetration depth — ALWAYS subscripted. Bare λ is the Kibble–Zurek
#        quench ramp and stays that way.
#   ξ_k  dispersion measured from μ (an energy).  ξ_0, ξ(T)  coherence length
#        (a length).  Bare ξ remains `correlation-length` and is never used here.
#        This is a deliberate, documented collision: the decorations always
#        distinguish the three, and the field uses all of them.
# =============================================================================

- id: meissner-effect
  name: "Meissner effect"
  symbol: "\\mathbf{B} = 0"
  blurb: "Flux expulsion from the bulk regardless of cooling history — an equilibrium property, which is what makes it a phase and not just perfect conduction."
  tags: [superconductivity, phenomenon]

- id: london-equation
  name: "London equations"
  symbol: "\\nabla \\times \\mathbf{j}_s = -\\mathbf{B}/\\mu_0\\lambda_L^2"
  blurb: "The minimal phenomenology that produces flux expulsion: assume the current responds to the field itself, not its rate of change."
  tags: [superconductivity, model]

- id: penetration-depth
  name: "London penetration depth"
  symbol: "\\lambda_L = \\sqrt{m/\\mu_0 n_s e^2}"
  blurb: "The thickness of the surface shell the field actually reaches; the one length the London equations contain."
  tags: [superconductivity, result]

- id: flux-quantization
  name: "Flux quantization"
  symbol: "\\Phi_0 = h/2e"
  blurb: "Trapped flux comes in units set by charge 2e — the experiment that says the carriers are pairs, before any theory of why."
  tags: [superconductivity, phenomenon]

# =============================================================================
# GEOMETRIC CONTROL — canonical home: "Four Metrics, One Ramp"
#
# Notation note for this thread (see CONTRIBUTING-posts.md §4):
#   u^μ  control parameters. Deliberately NOT λ (the Kibble–Zurek quench ramp)
#        and NOT x (which this thread's two-level toy model uses for the
#        coupling amplitude, alongside z for the detuning: H = ½(zZ + xX),
#        lowercase amplitudes against the site-wide capital Paulis).
#   δ    the adiabaticity tolerance, following all three modern papers. The
#        gap is Δ site-wide; ε is left to the spin-qubit thread.
# =============================================================================

- id: adiabatic-gauge-potential
  name: "Adiabatic gauge potential"
  symbol: "\\mathcal{A}_\\mu = i\\langle m \\vert \\partial_\\mu n\\rangle = i\\langle m\\vert\\partial_\\mu H\\vert n\\rangle/(E_n - E_m)"
  blurb: "The generator of parameter translations in the moving eigenbasis; every control metric in this thread is assembled from its matrix elements."
  tags: [geometric-control, formalism]

- id: quantum-geometric-tensor
  name: "Quantum geometric tensor"
  symbol: "Q_{\\mu\\nu}"
  blurb: "One complex tensor on control space: its real part measures distance between neighbouring ground states, its imaginary part is the Berry curvature."
  tags: [geometric-control, formalism]

- id: fubini-study-metric
  name: "Fubini–Study metric on control space"
  symbol: "g_{\\mu\\nu} = \\mathrm{Re}\\sum_{n\\neq 0} \\langle 0\\vert\\partial_\\mu H\\vert n\\rangle\\langle n\\vert\\partial_\\nu H\\vert 0\\rangle/\\Delta_n^2"
  blurb: "The real part of the quantum geometric tensor — the gap enters squared, once per level, and the matrix elements are projected on the ground state."
  tags: [geometric-control, formalism]

- id: geodesic-protocol
  name: "The geodesic-protocol skeleton"
  symbol: "T = L_G[\\gamma]/\\delta"
  blurb: "Fix an adiabaticity tolerance and the protocol time is a path length in some metric on control space; every framework in this thread is this statement with a different metric."
  tags: [geometric-control, formalism]

- id: path-versus-schedule
  name: "Path versus schedule"
  symbol: null
  blurb: "Choosing how fast to move along a fixed route is a different problem from choosing the route; length functionals are reparametrisation-invariant, so only the second one is geometry."
  tags: [geometric-control, formalism]

- id: local-adiabaticity
  name: "Local adiabaticity and FAQUAD"
  symbol: "\\lvert\\langle 1\\vert\\partial_u H\\vert 0\\rangle\\rvert\\,\\dot u/\\Delta^2 = \\mathrm{const}"
  blurb: "Hold the instantaneous adiabatic parameter constant over the whole ramp instead of the velocity — Roland–Cerf's condition and its FAQUAD descendant."
  tags: [geometric-control, technique]

- id: adiabatic-brachistochrone
  name: "Quantum adiabatic brachistochrone"
  symbol: "G^{\\mathrm{QAB}}_{\\mu\\nu} = \\mathrm{Tr}[\\partial_\\mu H\\,\\partial_\\nu H]/\\Delta^4"
  blurb: "A Hilbert–Schmidt numerator over the fourth power of the gap; for affine controls the numerator is a constant matrix and the metric is conformally flat."
  tags: [geometric-control, formalism]

- id: alpha-beta-hypergeometry
  name: "(α, β)-hypergeometries"
  symbol: "G^{(\\alpha,\\beta)}_{\\mu\\nu},\\;\\; n_+ = (\\alpha+\\beta)/2"
  blurb: "A two-parameter relabelling of control metrics that puts linear, geometric and FAQUAD protocols on one axis; for a single control only n₊ survives."
  tags: [geometric-control, formalism]

- id: projected-metric-degeneracy
  name: "Degeneracy of projected control metrics"
  symbol: "\\mathrm{rank}\\,G \\leq 2"
  blurb: "Ground-state-projected metrics have rank at most two, so in a two-level system driven by real controls they cannot select a path at all."
  tags: [geometric-control, result]

- id: landau-zener-arc-length
  name: "The π/2 of an avoided crossing"
  symbol: "\\int_{-\\infty}^{\\infty} ds_{\\mathrm{FS}} = \\pi/2"
  blurb: "A full Landau–Zener sweep has the same Fubini–Study length whatever the minimum gap — unweighted arc length is blind to the bottleneck it is meant to describe."
  tags: [geometric-control, result]
